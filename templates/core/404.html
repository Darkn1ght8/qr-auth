{% extends "base.html" %}
{% block title %}{% t "Страница не найдена" %}{% endblock %}
{% block page %}notfound{% endblock %}

{% block content %}
<section class="notfound">
  <div>
    <p class="notfound__code grad" data-split>404</p>
    <p class="lead" style="margin: 16px auto 32px">{% t "Такой страницы нет, или её срок истёк, как у QR-кода." %}</p>
    <a href="{% url 'core:home' %}" class="btn btn--primary" data-magnetic>{% t "На главную" %}</a>
  </div>
</section>
{% endblock %}
