{% if form.non_field_errors %}
<div class="form-errors" role="alert">{% for e in form.non_field_errors %}<p>{{ e }}</p>{% endfor %}</div>
{% endif %}
{% for field in form %}
<div class="field">
  <label class="field__label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.errors %}{% for e in field.errors %}<p class="field__error">{{ e }}</p>{% endfor %}
  {% elif field.help_text %}<p class="field__help">{{ field.help_text|safe }}</p>{% endif %}
</div>
{% endfor %}
