# Render Blueprint: https://render.com/docs/blueprint-spec
# Render → New → Blueprint → pick this repository → Apply.
# Changes to this file are synced to Render automatically on every push.
databases:
  # Free PostgreSQL: accounts, sessions and the audit log survive restarts
  # (the free web service's own disk is wiped whenever it spins down).
  - name: qr-auth-db
    plan: free
    databaseName: qrauth
    user: qrauth

services:
  - type: web
    name: qr-auth
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash start.sh
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_TRUST_PROXY
        value: "True"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: QR_HMAC_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: qr-auth-db
          property: connectionString
