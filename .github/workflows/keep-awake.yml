# Render's free web service sleeps after 15 minutes without traffic and then needs
# ~50 s to wake up. Pinging it every 10 minutes keeps it responsive for any phone.
name: keep-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the site
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 https://qr-auth-c0z2.onrender.com/healthz/; then echo; exit 0; fi
            sleep 10
          done
          echo "site did not answer" && exit 1
